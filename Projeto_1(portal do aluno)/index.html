<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Aluno - Gestão Completa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <h1 class="portal-title">Portal do Aluno</h1>
            <nav class="nav-menu">
                <a href="#" id="btn-inicio" onclick="navegar('inicio')">🏠 Início</a>
                <a href="#" id="btn-cadastrar" onclick="navegar('cadastrar')">➕ Cadastrar Produtos</a>
                <a href="#" id="btn-produtos" onclick="navegar('produtos')">📂 Meus Produtos</a>
                <a href="#" id="btn-precos" onclick="navegar('precos')">🏷️ Tabela de Preços</a>
                <a href="#" id="btn-mensagens" onclick="navegar('mensagens')">💬 Mensagens</a>
                <a href="#" id="btn-config" onclick="navegar('config')">⚙️ Configurações</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="search-bar">
                    🔍 <input type="text" id="inputPesquisa" placeholder="Digite o nome e aperte Enter..." onkeydown="verificarEnter(event)">
                </div>
                <div class="header-right">
                    <div class="msg-icon" onclick="navegar('mensagens')" style="cursor: pointer;">✉️ <span class="badge" id="msg-badge-top">0</span></div>
                    <div class="user-profile" onclick="navegar('config')">
                        <div class="avatar" id="user-photo">👤</div>
                        <span id="user-name-top">Ana Silva</span> ▾
                    </div>
                </div>
            </header>

            <!-- O JavaScript injetará a estrutura abaixo dentro desta div quando 'produtos' for ativo:
            <div class="abas-container">
                <button class="btn-aba aba-active" onclick="filtrarCategoria('Todos', this)">Todos</button>
                <button class="btn-aba" onclick="filtrarCategoria('Eletrônicos', this)">Eletrônicos</button>
                <button class="btn-aba" onclick="filtrarCategoria('Vestuário', this)">Vestuário</button>
                <button class="btn-aba" onclick="filtrarCategoria('Alimentos', this)">Alimentos</button>
            </div>
            -->
            <div id="dynamic-view">
            </div>

            <footer class="main-footer">
                © 2026 Curso de Desenvolvimento WEB | <strong>Bella e Duda</strong>
            </footer>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
